# -----------------------------------------------------
# Key bindings
# name: "Hyprscroller Bindings"
# -----------------------------------------------------
#
# SUPER KEY
$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts

# Applications
bind = $mainMod, RETURN, exec, ~/.config/hypr/settings/terminal.sh                          # Open the terminal
bind = $mainMod CTRL, RETURN, exec, pkill rofi || rofi -show drun -replace -i               # Open application launcher
bind = $mainMod, B, exec, ~/.config/hypr/settings/browser.sh                                # Open the browser
bind = $mainMod, E, exec, ~/.config/hypr/settings/filemanager.sh                            # Open the filemanager
bind = $mainMod CTRL, E, exec, ~/.config/hypr/settings/emojipicker.sh                       # Open the emoji picker
bind = $mainMod CTRL, C, exec, ~/.config/hypr/settings/calculator.sh                        # Open the calculator
bind = $mainMod, V, exec, $HYPRSCRIPTS/cliphist.sh                                          # Open clipboard manager

# Display
bind = $mainMod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # Increase display zoom                                                                                            
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # Decrease display zoom                                                                                            
bind = $mainMod SHIFT, Z, exec, hyprctl keyword cursor:zoom_factor 0                        # Reset display zoom

# Scroller Specific
bind = $mainMod, W, scroller:toggleoverview                                                 # Hyprscroller Overview Toggle
bind = $mainMod, P, scroller:pin                                                            # Pin current column
bind = $mainMod, S, scroller:setmode, t                                                     # Toggle Row or Column Scrolling Mode (t = toogle mode)
    # Resizing
bind = $mainMod, numbersign, scroller:fitheight, all 	                                    # Fit all windows in column to visible screen
bind = $mainMod, comma, scroller:cyclewidth, next 	                                        # Cycle focused column width.
bind = $mainMod, period, scroller:cycleheight, next                                         # Cycle focused column height
    # Selection & Submap
bind = $mainMod, Space, submap, selmode                                                     # Enter a “selection mode” submap
submap = selmode                                                                            # 
    bind = $mainMod, Space, scroller:selectiontoggle                                        # Toggle if focused window is in selection
    bind = $mainMod, escape, scroller:selectionreset                                        # Cancel current selected windows
                                                                                            # 
    bind = $mainMod, left, movefocus, l                                                     # 
    bind = $mainMod, right, movefocus, r                                                    # Submap move focus arrows
    bind = $mainMod, up, movefocus, u                                                       # 
    bind = $mainMod, down, movefocus, d                                                     # 
    bind = $mainMod, left, movefocus, l                                                     # 
    bind = $mainMod, right, movefocus, r                                                    # Submap move focus HJKL
    bind = $mainMod, up, movefocus, u                                                       # 
    bind = $mainMod, down, movefocus, d                                                     # 
                                                                                            # 
    bind = $mainMod SHIFT, left, scroller:selectionmove, l                                  # 
    bind = $mainMod SHIFT, right, scroller:selectionmove, r                                 # Move current selection arrows
    bind = $mainMod SHIFT, up, scroller:selectionmove, u                                    # 
    bind = $mainMod SHIFT, down, scroller:selectionmove, d                                  # 
    bind = $mainMod SHIFT, left, scroller:selectionmove, l                                  # 
    bind = $mainMod SHIFT, right, scroller:selectionmove, r                                 # Move current selection HJKL
    bind = $mainMod SHIFT, up, scroller:selectionmove, u                                    # 
    bind = $mainMod SHIFT, down, scroller:selectionmove, d                                  # 
                                                                                            # 
    bind = , escape, submap, reset                                                          # 
submap = reset                                                                              # 

# Expel and Consume pointless with movewindow, nomode
#bind = $mainMod, bracketleft, scroller:admitwindow, l
#bind = $mainMod, bracketright, scroller:admitwindow, r
#bind = $mainMod SHIFT, bracketleft, scroller:expelwindow, l
#bind = $mainMod SHIFT, bracketright, scroller:expelwindow, r

# Special 
bind = , F1, exec, $HYPRSCRIPTS/hyprscroller-mode.sh                              # Switch mode into scrolling mode, with vertical workspaces                                               
bind = , F2, exec, $HYPRSCRIPTS/hyprland-mode.sh                                  # Switch mode into hyprland mode, with horizontal workspaces                                                   
bind = , F3, togglefloating                                                                 # Toggle active windows into floating mode
bind = $mainMod, F3, workspaceopt, allfloat                                                 # Toggle all windows into floating mode
bind = , F4, exec, $HYPRSCRIPTS/keybindings.sh                                    # Show all Keybinds

bind = , F5, exec, waypaper --random                                                        # Change the wallpaper
bind = $mainMod SHIFT, F5, exec, waypaper                                                   # Open wallpaper selector
bind = , F6, exec, ~/.config/waybar/themeswitcher.sh                                        # Open waybar theme switcher

# Windows
bind = $mainMod, Q, killactive                                                              # Kill active window
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # Quit active window and all open instances
bind = $mainMod, F, fullscreen, 0                                                           # Set active window to fullscreen
bind = $mainMod, M, fullscreen, 1                                                           # Maximize Window
bind = $mainMod, R, togglesplit                                                             # Toggle split
bind = $mainMod SHIFT, R, swapsplit                                                         # Swapsplit
bind = $mainMod, G, togglegroup                                                             # Toggle window group
bindm = $mainMod, mouse:272, scroller:movewindow                                            # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow                                                   # Resize window with the mouse
bind = $mainMod, equal, resizeactive, 100 0                                                 # Increase window width with keyboard
bind = $mainMod, minus, resizeactive, -100 0                                                # Reduce window width with keyboard
bind = $mainMod SHIFT, equal, resizeactive, 0 100                                           # Increase window height with keyboard
bind = $mainMod SHIFT, minus, resizeactive, 0 -100                                          # Reduce window height with keyboard
binde = ALT,Tab,cyclenext                                                                   # Cycle between windows
binde = ALT,Tab,bringactivetotop                                                            # Bring active window to the top
    # Move Focus                                                                                                
bind = $mainMod, left, movefocus, l                                                         # Move Focus Left 
bind = $mainMod, right, movefocus, r                                                        # Move Focus Right
bind = $mainMod, up, movefocus, u                                                           # Move Focus Up
bind = $mainMod, down, movefocus, d                                                         # Move Focus Down
bind = $mainMod, H, movefocus, l                                                            # Move Focus Left
bind = $mainMod, L, movefocus, r                                                            # Move Focus Right
bind = $mainMod, K, movefocus, u                                                            # Move Focus Up 
bind = $mainMod, J, movefocus, d                                                            # Move Focus Down
    # Swap tiled window                                                                                            
bind = $mainMod SHIFT, left, scroller:movewindow, l, nomode                                 # Move Window Left  
bind = $mainMod SHIFT, right, scroller:movewindow, r, nomode                                # Move Window Right
bind = $mainMod SHIFT, up, scroller:movewindow, u, nomode                                   # Move Window Up
bind = $mainMod SHIFT, down, scroller:movewindow, d, nomode                                 # Move Window Down
bind = $mainMod SHIFT, H, scroller:movewindow, l, nomode                                    # Move Window Left
bind = $mainMod SHIFT, L, scroller:movewindow, r, nomode                                    # Move Window Right
bind = $mainMod SHIFT, J, scroller:movewindow, u, nomode                                    # Move Window Up
bind = $mainMod SHIFT, K, scroller:movewindow, d, nomode                                    # Move Window Down

# Workspaces
bind = $mainMod, 1, workspace, 1                                                            # Open Workspace 1
bind = $mainMod, 2, workspace, 2                                                            # Open Workspace 2
bind = $mainMod, 3, workspace, 3                                                            # Open Workspace 3
bind = $mainMod, 4, workspace, 4                                                            # Open Workspace 4
bind = $mainMod, 5, workspace, 5                                                            # Open Workspace 5
bind = $mainMod, 6, workspace, 6                                                            # Open Workspace 6 
bind = $mainMod, 7, workspace, 7                                                            # Open Workspace 7
bind = $mainMod, 8, workspace, 8                                                            # Open Workspace 8
bind = $mainMod, 9, workspace, 9                                                            # Open Workspace 9
bind = $mainMod, 0, workspace, 10                                                           # Open Workspace 10
    # Workspace Scrolling
bind = $mainMod CTRL, up, workspace, -1                                                     # Explicit Open or Move to Workspace -1 
bind = $mainMod CTRL, K, workspace, -1                                                      # Explicit Open or Move to Workspace -1 
bind = $mainMod CTRL, down, workspace, +1                                                   # Explicit Open or Move to Workspace +1
bind = $mainMod CTRL, J, workspace, +1                                                      # Explicit Open or Move to Workspace +1

# Move to Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1                                                # Move Window to Workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2                                                # Move Window to Workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3                                                # Move Window to Workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4                                                # Move Window to Workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5                                                # Move Window to Workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6                                                # Move Window to Workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7                                                # Move Window to Workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8                                                # Move Window to Workspace 8 
bind = $mainMod SHIFT, 9, movetoworkspace, 9                                                # Move Window to Workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10                                               # Move Window to Workspace 10
    # Move to Workspace Scrolling
bind = $mainMod SHIFT CTRL, up, movetoworkspace, -1                                         # Explicit Move Window to Workspace -1
bind = $mainMod SHIFT CTRL, K, movetoworkspace, -1                                          # Explicit Move Window to Workspace -1
bind = $mainMod SHIFT CTRL, down, movetoworkspace, +1                                       # Explicit Move Window to Workspace +1
bind = $mainMod SHIFT CTRL, J, movetoworkspace, +1                                          # Explicit Move Window to Workspace +1

bind = $mainMod CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1                                     # Move all windows to Workspace 1
bind = $mainMod CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2                                     # Move all windows to Workspace 2
bind = $mainMod CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3                                     # Move all windows to Workspace 3
bind = $mainMod CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4                                     # Move all windows to Workspace 4
bind = $mainMod CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5                                     # Move all windows to Workspace 5
bind = $mainMod CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6                                     # Move all windows to Workspace 6
bind = $mainMod CTRL, 7, exec, $HYPRSCRIPTS/moveTo.sh 7                                     # Move all windows to Workspace 7
bind = $mainMod CTRL, 8, exec, $HYPRSCRIPTS/moveTo.sh 8                                     # Move all windows to Workspace 8
bind = $mainMod CTRL, 9, exec, $HYPRSCRIPTS/moveTo.sh 9                                     # Move all windows to Workspace 9
bind = $mainMod CTRL, 0, exec, $HYPRSCRIPTS/moveTo.sh 10                                    # Move all windows to Workspace 10
                                    
# Actions
bind = $mainMod CTRL, R, exec, hyprctl reload                                               # Reload Hyprland configuration
bind = $mainMod SHIFT, A, exec, $HYPRSCRIPTS/toggle-animations.sh                           # Toggle animations
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh                                    # Take a screenshot
bind = $mainMod ALT, F, exec, $HYPRSCRIPTS/screenshot.sh --instant                          # Take an instant full-screen screenshot
bind = $mainMod ALT, S, exec, $HYPRSCRIPTS/screenshot.sh --instant-area                     # Take an instant area screenshot
bind = $mainMod CTRL, Q, exec, $HYPRSCRIPTS/wlogout.sh                            # Start wlogout
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh                                  # Reload waybar
bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh                                   # Toggle waybar
bind = $mainMod SHIFT, R, exec, $HYPRSCRIPTS/loadconfig.sh                                  # Reload hyprland config
bind = $mainMod ALT, G, exec, $HYPRSCRIPTS/gamemode.sh                                      # Toggle game mode
bind = CTRL, L, exec, $HYPRSCRIPTS/power.sh lock                                  # Start wlogout

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%                                 # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-                               # Reduce brightness by 10%
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ ""2""%+     # Increase volume by 5% (max 100% limit also added hold to raise volume)
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-              # Reduce volume by 5% (min 0% limit also added hold to lower volume)
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle                     # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause                                          # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause                                              # Audio pause
bind = , XF86AudioNext, exec, playerctl next                                                # Audio next
bind = , XF86AudioPrev, exec, playerctl previous                                            # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle              # Toggle microphone
bind = , XF86Calculator, exec, ~/.config/hypr/settings/calculator.sh                        # Open calculator
bind = , XF86Lock, exec, hyprlock                                                           # Open screenlock